
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكُميل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102e2a;color:#f5e9ce;font-family:Tahoma,Arial;text-align:center}
header{padding:35px 15px;background:linear-gradient(#102e2a,#24483b)}
h1{color:#e7c477;font-size:38px;margin:12px}
p{line-height:2}
main{padding:18px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px}
button{border:1px solid #c9a65b;background:#21463b;color:#f4d58d;border-radius:17px;padding:23px 8px;font-size:18px;font-weight:bold}
button:active{background:#456b53}
#content{margin-top:20px;padding:20px;background:#21463b;border-radius:18px;line-height:2}
.counter{font-size:48px;color:#e7c477}
</style>
</head>
<body>
<header>
<div style="font-size:55px">☪</div>
<h1>الكُميل</h1>
<p>نفحات إيمانية وروحانية<br>اللهم صلِّ على محمد وآل محمد</p>
</header>
<main>
<div class="menu">
<button onclick="show('الدعاء','الأدعية المختارة')">📖<br>الأدعية</button>
<button onclick="show('الزيارات','الزيارات المباركة')">🕌<br>الزيارات</button>
<button onclick="show('صلاة الليل','فضل صلاة الليل وأعمالها')">🌙<br>صلاة الليل وفضلها</button>
<button onclick="tasbeeh()">📿<br>المسبحة</button>
</div>
<div id="content">
<h2>أهلاً بك في الكُميل</h2>
<p>اختر قسماً للبدء</p>
</div>
</main>
<script>
function show(title,desc){
document.getElementById('content').innerHTML=
'<h2>'+title+'</h2><p>'+desc+'</p>';
}
let count=0;
function tasbeeh(){
count=0;
document.getElementById('content').innerHTML=
'<h2>المسبحة الإلكترونية</h2>'+
'<div class="counter" id="count">0</div>'+
'<button onclick="count++;document.getElementById(\'count\').innerText=count">سبّح 📿</button> '+
'<button onclick="count=0;document.getElementById(\'count\').innerText=count">إعادة</button>'+
'<p>اللهم صلِّ على محمد وآل محمد</p>';
}
</script>
</body>
</html>
